[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nykteris"
version = "0.1.0"
description = "A night report for Ekos/KStars astrophotography sessions: flags bad subs and explains why."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "astropy>=5.3",
    "sep>=1.2",
    "matplotlib>=3.7",
    "jinja2>=3.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
nykteris = "nykteris.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nykteris = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
