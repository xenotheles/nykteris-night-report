[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nykteris"
version = "0.1.0"
description = "A night report for Ekos/KStars and N.I.N.A. astrophotography sessions: flags bad subs and explains why."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "astropy>=5.3",
    "sep>=1.2",
    "matplotlib>=3.7",
    "jinja2>=3.1",
    "tomli>=2.0; python_version < '3.11'",
]

keywords = ["astrophotography", "ekos", "kstars", "nina", "phd2", "fits", "xisf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Homepage = "https://github.com/xenotheles/nykteris-night-report"
Issues = "https://github.com/xenotheles/nykteris-night-report/issues"
Changelog = "https://github.com/xenotheles/nykteris-night-report/blob/main/CHANGELOG.md"

[project.optional-dependencies]
xisf = ["lz4>=4", "zstandard>=0.21"]
test = ["pytest>=7"]

[project.scripts]
nykteris = "nykteris.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nykteris = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
